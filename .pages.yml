content:
  - name: soveltamisohjeet
    label: soveltamisohjeet
    type: collection
    path: content/soveltamisohje
    subfolders: true
    filename: '{primary}.md'
    extensions: [md]
    view:
      sort: [filename]
      default:
        sort: filename
        order: asc
    fields:
      - name: title
        label: Title
        type: string
      - name: body
        label: Body
        type: rich-text

  - name: taulukot
    label: taulukot
    type: collection
    path: content/soveltamisohje
    subfolders: true
    filename: '{primary}.json'
    extensions: [json]
    format: json
    fields:
      - name: rows
        label: Rows
        type: object
        list: true
        fields:
          - name: cell
            label: Cell
            type: string